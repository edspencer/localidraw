name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to a PR cancels that PR's older run. Pushes to main get a group per commit, so they never cancel each
# other: release.yml's verify-ci job waits for the CI run on the exact commit it's releasing, and a cancelled run
# there would block the release.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      # Built first: some tests start the CLI, which serves the built page.
      - name: Build
        run: npm run build
      - name: Tests
        run: npm test
      # Packs the package, installs the tarball into a temp prefix and runs it as a user would (scripts/smoke-pack.mjs).
      - name: Smoke-test the npm package
        run: npm run smoke:pack

  # The browser tests (e2e/), the theme snapshots included. They run in the official Playwright image, whose tag
  # matches @playwright/test (test/docs.test.ts checks), so screenshots compare against baselines made in the same
  # image: e2e/README.md.
  e2e:
    name: Browser tests (Chromium)
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host --init
    env:
      LOCALIDRAW_SNAPSHOTS: "1"
    steps:
      - uses: actions/checkout@v7
      - run: npm ci
      - name: Browser tests
        run: npm run test:e2e
      - name: Upload the report, traces and screenshot diffs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  website:
    name: Docs site build
    runs-on: ubuntu-latest
    # paths-filter reads the PR's changed-file list through the API.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      # Cloudflare Pages builds website/ on its own, so this catches a broken docs build before it merges. Only when
      # website/ changes; otherwise the job passes with its build steps skipped.
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            docs:
              - 'website/**'
      - uses: actions/setup-node@v7
        if: steps.filter.outputs.docs == 'true'
        with:
          node-version-file: website/.node-version
      # `npm install`, not `npm ci`: it's what Cloudflare Pages runs.
      - name: Install docs-site deps
        if: steps.filter.outputs.docs == 'true'
        run: npm install
        working-directory: website
      - name: Build docs site
        if: steps.filter.outputs.docs == 'true'
        run: npm run build
        working-directory: website
      # Every site-relative link (and #fragment) in the built pages resolves (no dependencies; scripts/check-links.mjs).
      - name: Check internal links
        if: steps.filter.outputs.docs == 'true'
        run: npm run check-links
        working-directory: website

  # Windows is best effort for now: paths, the recursive fs.watch and `explorer` for --open are untested there
  # (TODO.md, "Compatibility and platforms"). This leg reports what fails without blocking a merge: it's
  # continue-on-error, and ci-passed doesn't wait for it.
  windows:
    name: Test (Node 24, windows-latest, best effort)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        if: ${{ !cancelled() }}
        run: npm run build
      - name: Tests
        if: ${{ !cancelled() }}
        run: npm test
      - name: Smoke-test the npm package
        if: ${{ !cancelled() }}
        run: npm run smoke:pack

  # One stable check name to require in branch rules, so the matrix can change without editing them.
  ci-passed:
    name: CI passed
    if: always()
    needs: [test, e2e, website]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to have passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: ${RESULTS}"
          for r in ${RESULTS}; do
            if [ "${r}" != "success" ]; then
              echo "::error::a required job concluded '${r}'"
              exit 1
            fi
          done
