name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to a PR cancels that PR's older run. Pushes to main get a group per commit, so they never cancel each
# other: release.yml's verify-ci job waits for the CI run on the exact commit it's releasing, and a cancelled run
# there would block the release.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      # Built first: some tests start the CLI, which serves the built page.
      - name: Build
        run: npm run build
      # A limit, so a test that hangs fails the job instead of holding it for hours (npm test also limits each test).
      - name: Tests
        run: npm test
        timeout-minutes: 15
      # Packs the package, installs the tarball into a temp prefix and runs it as a user would (scripts/smoke-pack.mjs).
      - name: Smoke-test the npm package
        run: npm run smoke:pack
      # The CLI contract (github.com/edspencer/cli-contract): packs it, installs it into a temp prefix, and checks
      # --version, --help, a bad flag's exit code and usage, `service status` with nothing installed, `busy`, serve's
      # first line and /api/health, and `update` against a local registry: up to date, --check, no TTY, busy, npx, a
      # checkout, a global folder it can't write (as a non-root user only), an update and a downgrade.
      # cli-contract.json says which checks apply; the service job runs the two that need a real service manager.
      - name: CLI contract conformance
        run: npx cli-conformance

  # `localidraw service …` against the REAL service manager: launchd's gui/<uid> domain on the macOS runner, systemd's
  # user instance on the Ubuntu one (with lingering on, so there is one). scripts/service-real.mjs packs the package,
  # installs it into a temporary prefix, then installs, kills, stops, starts, restarts, refreshes, moves and
  # uninstalls the service. It writes the runner's real LaunchAgents or systemd user folder under the real label,
  # which is why it runs only here, and refuses without LOCALIDRAW_REAL_SERVICE=1. The dev box can't prove any of this:
  # test/service.test.ts covers the same commands against fake managers.
  service:
    name: Service (real ${{ matrix.os == 'macos-latest' && 'launchd' || 'systemd' }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # `systemctl --user` needs a user manager, and a runner has none until lingering starts one.
      - name: Start a systemd user instance (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo loginctl enable-linger "$USER"
          for i in $(seq 1 20); do [ -S "/run/user/$(id -u)/bus" ] && break; sleep 0.5; done
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - name: The service, for real
        env:
          LOCALIDRAW_REAL_SERVICE: "1"
        run: node scripts/service-real.mjs
      # `localidraw update` with the real service: from the packed version to one a minor higher, served by the
      # runner's local registry and installed into its temporary prefix, then one that won't start, which must roll
      # back to the old version, running again (exit 6). The test job runs the other update checks.
      - name: CLI contract conformance, update with a service
        env:
          CI_REAL_SERVICE: "1"
        run: npx cli-conformance --only update-service,update-rollback
      - name: The service's log, on failure
        if: ${{ failure() }}
        run: tail -n 100 ~/.localidraw/logs/service.log || true

  # The browser tests (e2e/), the theme snapshots included. They run in the official Playwright image, whose tag
  # matches @playwright/test (test/docs.test.ts checks), so screenshots compare against baselines made in the same
  # image: e2e/README.md.
  e2e:
    name: Browser tests (Chromium)
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host --init
    env:
      LOCALIDRAW_SNAPSHOTS: "1"
    steps:
      - uses: actions/checkout@v7
      - run: npm ci
      - name: Browser tests
        run: npm run test:e2e
      - name: Upload the report, traces and screenshot diffs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  website:
    name: Docs site build
    runs-on: ubuntu-latest
    # paths-filter reads the PR's changed-file list through the API.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      # Cloudflare Pages builds website/ on its own, so this catches a broken docs build before it merges. Only when
      # website/ changes; otherwise the job passes with its build steps skipped.
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            docs:
              - 'website/**'
      - uses: actions/setup-node@v7
        if: steps.filter.outputs.docs == 'true'
        with:
          node-version-file: website/.node-version
      # `npm install`, not `npm ci`: it's what Cloudflare Pages runs.
      - name: Install docs-site deps
        if: steps.filter.outputs.docs == 'true'
        run: npm install
        working-directory: website
      - name: Build docs site
        if: steps.filter.outputs.docs == 'true'
        run: npm run build
        working-directory: website
      # Every site-relative link (and #fragment) in the built pages resolves (no dependencies; scripts/check-links.mjs).
      - name: Check internal links
        if: steps.filter.outputs.docs == 'true'
        run: npm run check-links
        working-directory: website

  # The Docker image builds, starts healthy and serves as the docs say (scripts/smoke-image.sh), on amd64; the release
  # builds arm64 too, natively. Nothing is pushed from here.
  image:
    name: Docker image (amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: localidraw:smoke
          cache-from: type=gha,scope=ci-image
          cache-to: type=gha,mode=max,scope=ci-image
      - name: Start it and check it
        run: scripts/smoke-image.sh localidraw:smoke "$(node -p "require('./package.json').version")"

  # One stable check name to require in branch rules, so the matrix can change without editing them.
  ci-passed:
    name: CI passed
    if: always()
    needs: [test, service, e2e, website, image]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to have passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: ${RESULTS}"
          for r in ${RESULTS}; do
            if [ "${r}" != "success" ]; then
              echo "::error::a required job concluded '${r}'"
              exit 1
            fi
          done
