name: Bug report
description: Something in Localidraw doesn't work the way it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting it. For a security problem, please don't use this form: report it privately (see SECURITY.md).

        Screenshots and logs show file and folder names, and your drawings. Leave out anything you don't want public.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The commands you ran and what you did in the page. If it's about saving or merging, say what else was editing the file (a coding agent, a script, `git pull`), and attach a small `.excalidraw` file if you can.
      placeholder: |
        1. `npx localidraw ~/some/folder`
        2. Open … and draw …
        3. Meanwhile, … edits the same file
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Localidraw version
      description: The output of `npx localidraw --version` (or `localidraw --version`).
      placeholder: "0.2.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows (not officially supported yet)
        - Other
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: "macOS 26.1, Ubuntu 24.04, …"
  - type: input
    id: node
    attributes:
      label: Node.js version
      description: The output of `node --version`.
      placeholder: "v22.12.0"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: "Chrome 141, Safari 26, Firefox 145, …"
  - type: textarea
    id: logs
    attributes:
      label: Logs and screenshots
      description: Server output from the terminal, errors from the browser console, screenshots.
      render: text
